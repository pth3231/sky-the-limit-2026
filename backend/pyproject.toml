[project]
name = "draft-coach-backend"
version = "0.1.0"
description = "Data pipeline and backend for Draft Coach"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
    "zstandard>=0.23,<1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.19,<2",
    "httpx2>=2.16,<3",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]
